:root{--font-archivo:"Archivo",ui-sans-serif,system-ui,sans-serif;--font-nunito-sans:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;color-scheme:light}
html,body{margin:0;height:100%;background:var(--paper)}
.demo-toolbar{position:fixed;top:12px;right:12px;left:12px;z-index:60;display:flex;justify-content:flex-end;pointer-events:none}
.demo-bar{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;border-radius:18px;background:oklch(16% 0.028 42/.93);color:oklch(96% .006 70);box-shadow:0 12px 32px rgba(0,0,0,.25);backdrop-filter:blur(8px);font:700 13px/1.2 "Nunito Sans",system-ui,sans-serif}
.demo-select{max-width:220px;border:0;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.12);color:inherit;font:inherit;outline:none}
.demo-select option{color:#111}
.demo-segments{display:flex;padding:2px;border-radius:999px;background:rgba(255,255,255,.06)}
.demo-pill{border:0;border-radius:999px;padding:7px 12px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.demo-pill:hover{background:rgba(255,255,255,.1)}
.demo-pill-on,.demo-pill-on:hover{background:oklch(96% .006 70);color:oklch(16% .028 42)}
.demo-replay,.demo-replay:hover{background:oklch(66% .185 45);color:#fff}
.demo-hide{color:oklch(86% .01 70/.7)}
.demo-show{position:fixed;top:12px;right:12px;z-index:60;width:36px;height:36px;border:0;border-radius:999px;background:oklch(16% .028 42/.85);color:#fff;font:700 16px/1 system-ui;cursor:pointer}
.demo-phone-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-top:56px;background:oklch(90% .012 70)}
.demo-phone{transform-origin:top left;border:10px solid oklch(18% .02 42);border-radius:46px;background:var(--paper);box-shadow:0 30px 80px rgba(0,0,0,.3)}
.demo-ended{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:var(--paper)}
.demo-eyebrow{margin:0;font:700 12px/1 "Nunito Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep)}
.demo-ended-title{margin:0;max-width:30ch;font:700 26px/1.2 "Archivo",sans-serif;color:var(--ink)}
.demo-again{border:0;border-radius:12px;padding:12px 20px;background:oklch(16% .028 42);color:oklch(96% .006 70);font:700 15px/1 "Nunito Sans",sans-serif;cursor:pointer}
@media (max-width:767px){.demo-wide-only{display:none}}
